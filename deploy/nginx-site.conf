# Repository reference: deploy/nginx-site.conf (not active until installed).
# Example destination: /etc/nginx/sites-available/swpp26-django-api
# Enable with link: /etc/nginx/sites-enabled/swpp26-django-api
upstream swpp26_django_api {
    server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://swpp26_django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

}
